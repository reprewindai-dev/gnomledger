services:
  api:
    build: .
    ports:
      - "8001:8001"
    labels:
      - "traefik.http.services.gnom.loadbalancer.server.port=8001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8001
    networks:
      - coolify

networks:
  coolify:
    external: true
