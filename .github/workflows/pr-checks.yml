name: Gnomledger PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install repository-declared Ruff line
        run: python -m pip install 'ruff>=0.3.4,<0.4.0'

      - name: Ruff
        run: ruff check backend/app backend/tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend
          python -m pip install pytest pytest-asyncio

      - name: Pytest
        run: pytest -q backend/tests

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend
          python -m pip install pip-audit

      - name: Dependency audit
        run: pip-audit

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical image
        run: docker build -t gnomledger-ci:${{ github.sha }} .
