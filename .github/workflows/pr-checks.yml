name: Gnomledger PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend
          python -m pip install pytest pytest-asyncio ruff pip-audit

      - name: Ruff
        run: ruff check backend/app backend/tests

      - name: Pytest
        run: pytest -q backend/tests

      - name: Dependency audit
        run: pip-audit

      - name: Build canonical image
        run: docker build -t gnomledger-ci:${{ github.sha }} .
